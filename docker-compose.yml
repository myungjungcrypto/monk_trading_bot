version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monk_bot
      POSTGRES_USER: monk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monk -d monk_bot"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (FastAPI + Bot Engine) ──────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://monk:${DB_PASSWORD:-changeme}@db:5432/monk_bot
    ports:
      - "8000:8000"

  # ── Frontend (React → nginx 정적 빌드) ─────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - frontend_dist:/usr/share/nginx/html

  # ── Nginx (리버스 프록시) ───────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    # SSL 인증서 추가 시:
    # - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  pgdata:
  frontend_dist:
